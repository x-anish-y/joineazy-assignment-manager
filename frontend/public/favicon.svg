<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="assignHubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Connected Arc Gradient -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#assignHubBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Connected Team Constellation -->
  <g filter="url(#markShadow)">
    <!-- Arcs -->
    <path d="M19 23 C25 15, 39 15, 45 23" stroke="url(#linkGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M45 23 C49 33, 40 45, 32 47" stroke="url(#linkGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M32 47 C24 45, 15 33, 19 23" stroke="url(#linkGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- Nodes -->
    <circle cx="19" cy="23" r="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.75"/>
    <circle cx="45" cy="23" r="4" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.75"/>
    <circle cx="32" cy="47" r="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.75"/>

    <!-- Center Checkmark -->
    <path d="M24 33 L29.5 38.5 L40 27" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
