<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Mark -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Indigo Gradient -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Inner Soft Ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- JoinEazy 'J' Mark -->
  <g filter="url(#glowShadow)">
    <!-- Top Bar -->
    <path
      d="M26 16.5H41"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />
    <!-- J Stem and Loop -->
    <path
      d="M37.5 16.5V36C37.5 42.6 32.1 48 25.5 48C20.2 48 15.8 44.8 14.2 40"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Electric Collaboration / Completion Spark Dot -->
    <circle
      cx="20.5"
      cy="25.5"
      r="4.25"
      fill="url(#cyanSpark)"
      stroke="#FFFFFF"
      stroke-width="1.75"
    />
  </g>
</svg>
